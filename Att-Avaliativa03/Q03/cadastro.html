<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="assets/css/cadastro-style.css">
    
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>Cadastre-se</h1>

            <form>
                <div class="campo">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" placeholder="Digite seu nome">
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail">
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" placeholder="(00) 00000-0000">
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Crie uma senha">
                </div>

                <div class="campo">
                    <label for="confirmar">Confirmar Senha</label>
                    <input type="password" id="confirmar" placeholder="Repita a senha">
                </div>

                <button type="submit">Cadastrar</button>

                <p>
                    Já possui uma conta?
                    <a href="/Att-Avaliativa03/Q03/index.html">Entrar</a>
                </p>
            </form>
        </div>
    </div>

</body>
</html>
